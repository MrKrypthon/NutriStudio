# Sólo en producción (docker-compose.prod.yml, fase 115). Caddy está delante de Nginx, así que la
# conexión que ve Nginx es la de Caddy. Caddy pone la IP real del usuario en X-Forwarded-For; Nginx la
# toma como $remote_addr SÓLO si la petición viene de la red edge (172.31.250.0/24), donde no hay más
# que Caddy. Después nginx.conf la vuelve a poner en X-Forwarded-For para la API.
set_real_ip_from 172.31.250.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
