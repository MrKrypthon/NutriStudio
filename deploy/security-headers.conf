# Encabezados de seguridad de la app (fase 113). Se incluyen en cada `location` que sirve archivos,
# porque un `add_header` dentro de una location anula los heredados del server.
#
# CSP: Google Identity Services (botón y popup), Google Fonts, OCR con WebAssembly
# ('wasm-unsafe-eval'), workers de pdf.js y del OCR (blob:) y vistas previas de PDF en iframe (blob:).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Google Identity Services necesita el origen en el Referer y poder abrir su popup.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Con HTTPS (en el VPS, detrás del certificado) agrega también:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
