# Nginx del contenedor `web` (fase 113): sirve el build de Vite y pasa /api a la API.
server_tokens off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # La API acepta cuerpos de hasta 15 MB (PDF de laboratorio en base64).
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  # La API responde a través de proxy: sin `any`, Nginx no comprime lo proxyado (el JSON del
  # constructor y del catálogo es justo lo que más pesa).
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API. X-Forwarded-For se REEMPLAZA por la IP de la conexión (no se agrega a la que mande el
  # cliente), así nadie elige su IP; la API confía en este salto con TRUST_PROXY.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /health {
    proxy_pass http://api:3001/health;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Archivos con hash en el nombre (Vite): se pueden guardar un año.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;

    # El worker de pdf.js es un módulo .mjs, que el mime.types de Nginx 1.27 no conoce: salía como
    # application/octet-stream y, con nosniff, el navegador no lo ejecutaba (no se veían los PDF ni
    # corría el OCR). `types` aquí reemplaza la tabla heredada, por eso sólo en esta ubicación.
    location ~ \.mjs$ {
      types { application/javascript mjs; }
      try_files $uri =404;
    }
  }

  # Motor y modelos del OCR: no cambian de nombre, pero sí entre versiones.
  location /ocr/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # La SPA: cualquier ruta sirve index.html, que no se guarda en caché (apunta a los assets nuevos).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
